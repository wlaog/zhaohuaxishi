<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>朝花夕拾 · 登录</title><link rel="stylesheet" href="/auth/style.css"><script src="/auth/login.js" defer></script></head>
<body><main><span class="mark" aria-hidden="true">拾</span><p class="eyebrow">朝花夕拾</p><h1>回到你的日记。</h1><p>输入在电脑控制台设置的访问密码。</p><form id="login-form"><label for="password">访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus><button type="submit">打开日记</button><p id="login-status" role="status"></p></form><small>此设备记住登录 30 天。电脑重启服务或修改密码后需重新登录。<br>公共设备使用后，请退出登录。</small></main></body>
</html>
